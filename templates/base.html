{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Monitor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>

        /* ╔══════════════════════════════════════════════════════════╗
           ║  PHASE 2 — DESIGN TOKENS + INTERACTION SYSTEM           ║
           ╚══════════════════════════════════════════════════════════╝ */
        :root {
            /* Backgrounds */
            --bg-root:         #07090f;
            --bg-surface:      #0b0f18;
            --bg-card:         #0f1623;
            --bg-card-hover:   #131c2e;
            --bg-elevated:     #172035;
            --bg-overlay:      rgba(7,9,15,0.92);

            /* Borders */
            --border:          rgba(255,255,255,0.055);
            --border-subtle:   rgba(255,255,255,0.028);
            --border-medium:   rgba(255,255,255,0.09);
            --border-focus:    rgba(99,179,255,0.45);

            /* Accent palette */
            --accent:          #3b82f6;
            --accent-glow:     rgba(59,130,246,0.22);
            --accent-bright:   #60a5fa;
            --accent-muted:    rgba(59,130,246,0.10);
            --accent-subtle:   rgba(59,130,246,0.06);

            /* Semantic colours */
            --teal:            #14b8a6;
            --teal-glow:       rgba(20,184,166,0.18);
            --amber:           #f59e0b;
            --amber-glow:      rgba(245,158,11,0.18);
            --red:             #ef4444;
            --red-glow:        rgba(239,68,68,0.18);
            --green:           #10b981;
            --green-glow:      rgba(16,185,129,0.18);
            --violet:          #8b5cf6;

            /* Typography */
            --text-primary:    #eef2f7;
            --text-secondary:  #8896aa;
            --text-muted:      #424f62;
            --text-accent:     #93c5fd;

            /* Sidebar */
            --sidebar-w:       242px;
            --sidebar-w-collapsed: 60px;

            /* Radius system */
            --radius-xs:  4px;
            --radius-sm:  7px;
            --radius-md:  11px;
            --radius-lg:  15px;
            --radius-xl:  22px;

            /* Shadow depth system */
            --shadow-xs:   0 1px 2px rgba(0,0,0,0.35);
            --shadow-sm:   0 1px 3px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.25);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.45), 0 4px 20px rgba(0,0,0,0.32);
            --shadow-glow: 0 0 0 1px var(--border-medium), 0 6px 28px rgba(0,0,0,0.5);
            --shadow-accent: 0 0 0 1px rgba(59,130,246,0.25), 0 4px 20px rgba(59,130,246,0.15);
            --shadow-float:  0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);

            /* Transitions */
            --ease-out:    cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --t-fast:      0.12s;
            --t-base:      0.18s;
            --t-slow:      0.30s;
            --t-sidebar:   0.28s;
            --transition:  all var(--t-base) var(--ease-out);
            --transition-slow: all var(--t-slow) var(--ease-out);
        }

        /* ── RESET ──────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-root);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ── PAGE FADE-IN ───────────────────────────────────────────── */
        body {
            animation: page-enter 0.4s var(--ease-out) both;
        }

        @keyframes page-enter {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── AMBIENT BACKGROUND ─────────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 35% at 12% 0%,  rgba(59,130,246,0.08) 0%, transparent 55%),
                radial-gradient(ellipse 40% 28% at 88% 100%, rgba(20,184,166,0.055) 0%, transparent 50%),
                radial-gradient(ellipse 30% 20% at 50% 50%, rgba(59,130,246,0.025) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  SIDEBAR — COLLAPSIBLE                                   ║
           ╚══════════════════════════════════════════════════════════╝ */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 200;
            transition: width var(--t-sidebar) var(--ease-out);
            overflow: hidden;
            will-change: width;
        }

        /* Top accent line */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
            opacity: 0.45;
            z-index: 1;
        }

        /* Collapsed state */
        body.sidebar-collapsed .sidebar {
            width: var(--sidebar-w-collapsed);
        }

        body.sidebar-collapsed .brand-text,
        body.sidebar-collapsed .brand-sub,
        body.sidebar-collapsed .nav-label-text,
        body.sidebar-collapsed .nav-section-label,
        body.sidebar-collapsed .status-text,
        body.sidebar-collapsed .sidebar-footer-status {
            opacity: 0;
            pointer-events: none;
            width: 0;
            overflow: hidden;
        }

        body.sidebar-collapsed .sidebar-brand {
            padding: 18px 14px;
            justify-content: center;
        }

        body.sidebar-collapsed .sidebar a {
            padding: 9px 0;
            justify-content: center;
            gap: 0;
        }

        body.sidebar-collapsed .nav-icon {
            width: 100%;
            text-align: center;
            font-size: 16px;
            opacity: 0.7;
        }

        body.sidebar-collapsed .sidebar-footer {
            padding: 12px 8px;
        }

        body.sidebar-collapsed .sidebar-footer-status {
            display: none;
        }

        body.sidebar-collapsed .main {
            margin-left: var(--sidebar-w-collapsed);
        }

        /* Smooth main content shift */
        .main {
            margin-left: var(--sidebar-w);
            transition: margin-left var(--t-sidebar) var(--ease-out);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* ── BRAND ──────────────────────────────────────────────────── */
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border-subtle);
            text-decoration: none;
            flex-shrink: 0;
            transition: padding var(--t-sidebar) var(--ease-out);
            min-width: var(--sidebar-w);
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 0 14px var(--accent-glow), 0 2px 4px rgba(0,0,0,0.3);
            transition: box-shadow var(--t-base) var(--ease-out);
        }

        .brand-icon:hover {
            box-shadow: 0 0 20px var(--accent-glow), 0 2px 4px rgba(0,0,0,0.3);
        }

        .brand-text {
            font-family: 'Syne', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.15;
            white-space: nowrap;
            transition: opacity var(--t-base) var(--ease-out),
                        width var(--t-sidebar) var(--ease-out);
        }

        .brand-sub {
            font-size: 9.5px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 1px;
            white-space: nowrap;
            transition: opacity var(--t-base) var(--ease-out);
        }

        /* ── NAV ────────────────────────────────────────────────────── */
        .sidebar-nav {
            flex: 1;
            padding: 10px 8px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
        }
        .sidebar-nav::-webkit-scrollbar { display: none; }

        .nav-section-label {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 10px 10px 5px;
            white-space: nowrap;
            transition: opacity var(--t-base) var(--ease-out);
        }

        /* ── NAV LINKS — slide-in effect ───────────────────────────── */
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 450;
            letter-spacing: -0.01em;
            transition:
                color      var(--t-base) var(--ease-out),
                background var(--t-base) var(--ease-out),
                transform  var(--t-base) var(--ease-out),
                box-shadow var(--t-base) var(--ease-out),
                padding    var(--t-sidebar) var(--ease-out);
            position: relative;
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Slide-in left accent bar */
        .sidebar a::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 2.5px;
            height: 65%;
            background: linear-gradient(180deg, var(--accent-bright), var(--accent));
            border-radius: 0 2px 2px 0;
            transition: transform 0.2s var(--ease-spring);
        }

        /* Hover shimmer overlay */
        .sidebar a::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                rgba(59,130,246,0.0) 0%,
                rgba(59,130,246,0.03) 100%);
            opacity: 0;
            transition: opacity var(--t-base) var(--ease-out);
        }

        .sidebar a:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.048);
            transform: translateX(2px);
        }

        .sidebar a:hover::before {
            transform: translateY(-50%) scaleY(1);
        }

        .sidebar a:hover::after { opacity: 1; }

        .sidebar a.active {
            color: var(--text-primary);
            background: var(--accent-muted);
            font-weight: 500;
            box-shadow: inset 0 0 0 1px rgba(59,130,246,0.1);
        }

        .sidebar a.active::before {
            transform: translateY(-50%) scaleY(1);
        }

        .nav-icon {
            font-size: 14px;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            opacity: 0.72;
            transition: opacity var(--t-base) var(--ease-out),
                        transform var(--t-base) var(--ease-out);
        }

        .sidebar a:hover .nav-icon {
            opacity: 1;
            transform: scale(1.08);
        }

        .sidebar a.active .nav-icon { opacity: 1; }

        .nav-label-text {
            white-space: nowrap;
            transition: opacity var(--t-base) var(--ease-out),
                        width var(--t-sidebar) var(--ease-out);
        }

        /* ── SIDEBAR FOOTER ─────────────────────────────────────────── */
        .sidebar-footer {
            padding: 10px 8px 12px;
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
            transition: padding var(--t-sidebar) var(--ease-out);
        }

        .sidebar-footer-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            background: rgba(16,185,129,0.055);
            border: 1px solid rgba(16,185,129,0.12);
            transition: var(--transition);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
            box-shadow: 0 0 0 0 var(--green-glow);
            animation: pulse-ring 2.8s var(--ease-out) infinite;
        }

        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0   rgba(16,185,129,0.6); }
            60%  { box-shadow: 0 0 0 5px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0   rgba(16,185,129,0); }
        }

        .status-text {
            font-size: 11px;
            color: var(--green);
            font-weight: 500;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  TOPBAR                                                  ║
           ╚══════════════════════════════════════════════════════════╝ */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 52px;
            background: rgba(7,9,15,0.82);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 12px;
            transition: background var(--t-base) var(--ease-out);
        }

        .topbar-left  { display: flex; align-items: center; gap: 10px; }
        .topbar-right { display: flex; align-items: center; gap: 8px; }

        /* ── Sidebar toggle button ───────────────────────────────── */
        .sidebar-toggle {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            padding: 7px 6px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .sidebar-toggle:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--border-medium);
            color: var(--text-primary);
        }

        .sidebar-toggle span {
            display: block;
            height: 1.5px;
            border-radius: 2px;
            background: currentColor;
            transition: width var(--t-base) var(--ease-out),
                        transform var(--t-base) var(--ease-out),
                        opacity var(--t-base) var(--ease-out);
        }

        .sidebar-toggle .bar-top    { width: 14px; }
        .sidebar-toggle .bar-mid    { width: 10px; }
        .sidebar-toggle .bar-bot    { width: 12px; }

        body.sidebar-collapsed .sidebar-toggle .bar-top { width: 12px; }
        body.sidebar-collapsed .sidebar-toggle .bar-mid { width: 14px; }
        body.sidebar-collapsed .sidebar-toggle .bar-bot { width: 10px; }

        .topbar-breadcrumb {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .topbar-breadcrumb span {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .topbar-divider {
            width: 1px;
            height: 14px;
            background: var(--border);
        }

        /* ── Topbar chips ────────────────────────────────────────── */
        .topbar-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
            cursor: default;
            letter-spacing: 0.01em;
        }

        .topbar-chip:hover {
            border-color: var(--border-medium);
            color: var(--text-primary);
            background: var(--bg-elevated);
        }

        .topbar-chip .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 5px var(--green);
            animation: pulse-ring 2.8s var(--ease-out) infinite;
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  PAGE CONTENT                                            ║
           ╚══════════════════════════════════════════════════════════╝ */
        .page-content {
            padding: 28px 28px 56px;
            flex: 1;
            animation: content-enter 0.38s var(--ease-out) both;
        }

        @keyframes content-enter {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  CARDS                                                   ║
           ╚══════════════════════════════════════════════════════════╝ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            transition:
                transform  var(--t-base) var(--ease-out),
                box-shadow var(--t-base) var(--ease-out),
                border-color var(--t-base) var(--ease-out),
                background var(--t-base) var(--ease-out);
            overflow: hidden;
            will-change: transform;
        }

        .card:hover {
            border-color: var(--border-medium);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
            background: var(--bg-card-hover);
        }

        .card-glass {
            background: rgba(15,22,35,0.65);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }

        /* ── STAT CARDS ─────────────────────────────────────────────── */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            position: relative;
            overflow: hidden;
            transition:
                transform    var(--t-base) var(--ease-out),
                box-shadow   var(--t-base) var(--ease-out),
                border-color var(--t-base) var(--ease-out),
                background   var(--t-base) var(--ease-out);
            will-change: transform;
        }

        /* Shimmer top line */
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,255,255,0.06) 50%,
                transparent 100%);
        }

        .stat-card:hover {
            border-color: var(--border-medium);
            background: var(--bg-card-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }

        /* ── Skeleton loader ──────────────────────────────────────── */
        .skeleton {
            border-radius: var(--radius-sm);
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0.03) 25%,
                rgba(255,255,255,0.07) 50%,
                rgba(255,255,255,0.03) 75%
            );
            background-size: 200% 100%;
            animation: skeleton-sweep 1.6s var(--ease-out) infinite;
        }

        @keyframes skeleton-sweep {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-text  { height: 12px; width: 60%; }
        .skeleton-value { height: 36px; width: 45%; margin: 10px 0; }
        .skeleton-badge { height: 20px; width: 80px; border-radius: 20px; }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  TYPOGRAPHY                                              ║
           ╚══════════════════════════════════════════════════════════╝ */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Syne', sans-serif;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 21px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 13.5px;
            font-weight: 650;
            color: var(--text-primary);
            letter-spacing: -0.015em;
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  BADGES                                                  ║
           ╚══════════════════════════════════════════════════════════╝ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 9px 2px 7px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 650;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .badge::before {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .badge-success { background: rgba(16,185,129,0.1);  color: #34d399; border: 1px solid rgba(16,185,129,0.18); }
        .badge-warning { background: rgba(245,158,11,0.1);  color: #fbbf24; border: 1px solid rgba(245,158,11,0.18); }
        .badge-danger  { background: rgba(239,68,68,0.1);   color: #f87171; border: 1px solid rgba(239,68,68,0.18); }
        .badge-info    { background: rgba(59,130,246,0.1);  color: #93c5fd; border: 1px solid rgba(59,130,246,0.18); }
        .badge-neutral { background: rgba(148,163,184,0.07);color: #94a3b8; border: 1px solid rgba(148,163,184,0.10); }
        .badge-violet  { background: rgba(139,92,246,0.1);  color: #c4b5fd; border: 1px solid rgba(139,92,246,0.18); }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  BUTTONS — glow hover system                            ║
           ╚══════════════════════════════════════════════════════════╝ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 15px;
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            outline: none;
            transition:
                background  var(--t-base) var(--ease-out),
                box-shadow  var(--t-base) var(--ease-out),
                color       var(--t-base) var(--ease-out),
                transform   var(--t-fast) var(--ease-out),
                border-color var(--t-base) var(--ease-out);
            text-decoration: none;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.01em;
        }

        /* Ripple shimmer overlay */
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background var(--t-fast) var(--ease-out);
            border-radius: inherit;
        }

        .btn:hover::after { background: rgba(255,255,255,0.055); }
        .btn:active { transform: scale(0.97); }

        .btn:disabled, .btn.loading {
            opacity: 0.6;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Loading spinner inside btn */
        .btn.loading::before {
            content: '';
            width: 12px; height: 12px;
            border: 1.5px solid rgba(255,255,255,0.25);
            border-top-color: rgba(255,255,255,0.9);
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.35),
                        0 0 0 1px rgba(59,130,246,0.35),
                        0 0 12px rgba(59,130,246,0.0);
        }

        .btn-primary:hover {
            background: var(--accent-bright);
            box-shadow: 0 2px 8px rgba(59,130,246,0.45),
                        0 0 0 1px rgba(59,130,246,0.5),
                        0 0 20px rgba(59,130,246,0.2);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--border-medium);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
            border-color: var(--border);
        }

        .btn-danger {
            background: rgba(239,68,68,0.09);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.18);
        }

        .btn-danger:hover {
            background: rgba(239,68,68,0.16);
            border-color: rgba(239,68,68,0.32);
            box-shadow: 0 0 16px rgba(239,68,68,0.12);
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  TABLES                                                  ║
           ╚══════════════════════════════════════════════════════════╝ */
        .table-wrapper {
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--bg-card);
            animation: table-enter 0.4s var(--ease-out) both;
        }

        @keyframes table-enter {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        thead {
            background: rgba(255,255,255,0.018);
            border-bottom: 1px solid var(--border);
        }

        thead th {
            padding: 11px 16px;
            text-align: left;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.09em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border-subtle);
            transition:
                background var(--t-fast) var(--ease-out),
                box-shadow var(--t-fast) var(--ease-out);
        }

        tbody tr:last-child { border-bottom: none; }

        tbody tr:hover {
            background: rgba(59,130,246,0.04);
            box-shadow: inset 0 0 0 1px rgba(59,130,246,0.06);
        }

        tbody td {
            padding: 12px 16px;
            color: var(--text-secondary);
            vertical-align: middle;
            line-height: 1.45;
        }

        tbody td:first-child { color: var(--text-primary); font-weight: 480; }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  FORMS                                                   ║
           ╚══════════════════════════════════════════════════════════╝ */
        input, select, textarea {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            padding: 8px 12px;
            outline: none;
            transition: var(--transition);
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1),
                        0 0 0 1px rgba(59,130,246,0.2);
        }

        input:hover:not(:focus), select:hover:not(:focus) {
            border-color: var(--border-medium);
        }

        input::placeholder, textarea::placeholder { color: var(--text-muted); }

        label {
            display: block;
            font-size: 11.5px;
            font-weight: 550;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  LOADING SPINNER (global)                               ║
           ╚══════════════════════════════════════════════════════════╝ */
        .spinner {
            width: 22px; height: 22px;
            border: 2px solid rgba(255,255,255,0.06);
            border-top-color: var(--accent);
            border-right-color: rgba(59,130,246,0.4);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .spinner-sm {
            width: 14px; height: 14px;
            border-width: 1.5px;
        }

        /* ╔══════════════════════════════════════════════════════════╗
           ║  UTILITIES                                               ║
           ╚══════════════════════════════════════════════════════════╝ */
        .divider { height: 1px; background: var(--border); margin: 20px 0; }

        ::-webkit-scrollbar       { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

        .text-primary   { color: var(--text-primary)   !important; }
        .text-secondary { color: var(--text-secondary) !important; }
        .text-muted     { color: var(--text-muted)     !important; }
        .text-accent    { color: var(--text-accent)    !important; }
        .text-green     { color: var(--green)          !important; }
        .text-amber     { color: var(--amber)          !important; }
        .text-red       { color: var(--red)            !important; }
        .text-teal      { color: var(--teal)           !important; }
        .text-violet    { color: var(--violet)         !important; }

        .font-mono {
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 11.5px;
            letter-spacing: 0.01em;
        }

        .flex            { display: flex; }
        .items-center    { align-items: center; }
        .items-start     { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center  { justify-content: center; }
        .flex-col        { flex-direction: column; }
        .flex-1          { flex: 1; }
        .gap-1 { gap:  4px; } .gap-2 { gap: 8px;  }
        .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
        .gap-5 { gap: 20px; } .gap-6 { gap: 24px; }

        .mt-1 { margin-top:  4px; } .mt-2 { margin-top:  8px; }
        .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
        .mt-6 { margin-top: 24px; } .mt-8 { margin-top: 32px; }
        .mb-2 { margin-bottom: 8px; }  .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
        .mb-8 { margin-bottom: 32px; }

        .p-4  { padding: 16px; } .p-5 { padding: 20px; } .p-6 { padding: 24px; }
        .px-4 { padding-left: 16px; padding-right: 16px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }

        .w-full  { width: 100%; }
        .rounded { border-radius: var(--radius-sm); }
        .rounded-lg { border-radius: var(--radius-lg); }
        .overflow-hidden { overflow: hidden; }
        .relative { position: relative; }

        .grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }

        @media (max-width: 1200px) { .grid-4 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 960px)  { .grid-3 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 720px)  { .grid-3, .grid-2, .grid-4 { grid-template-columns: 1fr; } }

        /* ── Stagger animations ─────────────────────────────────── */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fade-up 0.36s var(--ease-out) both;
        }

        .delay-1 { animation-delay: 0.06s; }
        .delay-2 { animation-delay: 0.12s; }
        .delay-3 { animation-delay: 0.18s; }
        .delay-4 { animation-delay: 0.24s; }
        .delay-5 { animation-delay: 0.30s; }

        /* ── Tooltip ────────────────────────────────────────────── */
        [data-tip] { position: relative; }

        [data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            left: 110%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-elevated);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--t-base) var(--ease-out);
            box-shadow: var(--shadow-float);
            z-index: 999;
            font-family: 'DM Sans', sans-serif;
        }

        [data-tip]:hover::after { opacity: 1; }

    </style>
</head>
<body>

<!-- ── SIDEBAR ──────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">

    <!-- Brand -->
    <a href="/" class="sidebar-brand">
        <div class="brand-icon">⚡</div>
        <div>
            <div class="brand-text">AI Monitor</div>
            <div class="brand-sub">Control Center</div>
        </div>
    </a>

    <!-- Nav -->
    <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>

        <a href="/" data-tip="Dashboard">
            <span class="nav-icon">⊞</span>
            <span class="nav-label-text">Dashboard</span>
        </a>
        <a href="/analytics/" data-tip="Analytics">
            <span class="nav-icon">◈</span>
            <span class="nav-label-text">Analytics</span>
        </a>
        <a href="/logs/" data-tip="Logs">
            <span class="nav-icon">≡</span>
            <span class="nav-label-text">Logs</span>
        </a>

        <div class="nav-section-label" style="margin-top:10px;">Management</div>

        <a href="/investigations/" data-tip="Investigations">
            <span class="nav-icon">⊙</span>
            <span class="nav-label-text">Investigations</span>
        </a>
        <a href="/settings/" data-tip="Settings">
            <span class="nav-icon">⊛</span>
            <span class="nav-label-text">Settings</span>
        </a>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
        <div class="sidebar-footer-status">
            <span class="status-dot"></span>
            <span class="status-text">All systems operational</span>
        </div>
    </div>

</aside>

<!-- ── MAIN ─────────────────────────────────────────────────────────── -->
<div class="main" id="main">

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">

            <!-- Sidebar toggle -->
            <button class="sidebar-toggle" id="sidebar-toggle"
                    aria-label="Toggle sidebar" title="Toggle sidebar">
                <span class="bar-top"></span>
                <span class="bar-mid"></span>
                <span class="bar-bot"></span>
            </button>

            <div class="topbar-divider"></div>

            <span class="topbar-breadcrumb">
                AI Monitor <span id="breadcrumb-page">/ Overview</span>
            </span>
        </div>

        <div class="topbar-right">
            <div class="topbar-chip">
                <span class="dot"></span>
                Live
            </div>
            <div class="topbar-chip">v2.1.0</div>
        </div>
    </header>

    <!-- Page content -->
    <div class="page-content">
        {% block content %}{% endblock %}
    </div>

</div>

<script src="{% static 'script.js' %}"></script>
<script>
(function () {
    'use strict';

    /* ── 1. ACTIVE NAV LINK ──────────────────────────────────────── */
    const path = window.location.pathname;
    const navLinks = document.querySelectorAll('.sidebar a[href]');

    navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href === path || (href !== '/' && path.startsWith(href))) {
            link.classList.add('active');
        }
    });

    /* ── 2. BREADCRUMB AUTO-UPDATE ───────────────────────────────── */
    const pageMap = {
        '/':               '/ Dashboard',
        '/analytics/':     '/ Analytics',
        '/logs/':          '/ Logs',
        '/investigations/':'/ Investigations',
        '/settings/':      '/ Settings',
    };
    const bc = document.getElementById('breadcrumb-page');
    if (bc && pageMap[path]) bc.textContent = pageMap[path];

    /* ── 3. COLLAPSIBLE SIDEBAR ──────────────────────────────────── */
    const toggle   = document.getElementById('sidebar-toggle');
    const STORAGE_KEY = 'aimonitor_sidebar_collapsed';

    function applyCollapsed(collapsed, animate) {
        if (!animate) document.body.style.transition = 'none';
        if (collapsed) {
            document.body.classList.add('sidebar-collapsed');
        } else {
            document.body.classList.remove('sidebar-collapsed');
        }
        if (!animate) {
            // force reflow then re-enable
            void document.body.offsetHeight;
            document.body.style.transition = '';
        }
        // tooltips: only show in collapsed state
        const tips = document.querySelectorAll('.sidebar a[data-tip]');
        tips.forEach(el => {
            if (collapsed) {
                el.style.setProperty('--tip-display', 'block');
            } else {
                el.style.removeProperty('--tip-display');
            }
        });
    }

    // Restore persisted state instantly (no animation on load)
    const savedState = localStorage.getItem(STORAGE_KEY) === 'true';
    applyCollapsed(savedState, false);

    // Toggle on click
    if (toggle) {
        toggle.addEventListener('click', () => {
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            const next = !isCollapsed;
            applyCollapsed(next, true);
            localStorage.setItem(STORAGE_KEY, next);
        });
    }

    /* ── 4. BUTTON LOADING STATE ─────────────────────────────────── */
    // Buttons with data-loading auto-show loading state on click
    document.addEventListener('click', e => {
        const btn = e.target.closest('[data-loading]');
        if (!btn) return;
        btn.classList.add('loading');
        const ms = parseInt(btn.getAttribute('data-loading')) || 1800;
        setTimeout(() => btn.classList.remove('loading'), ms);
    });

    /* ── 5. SMOOTH PAGE TRANSITIONS ─────────────────────────────── */
    // Intercept internal nav clicks for fade-out
    document.querySelectorAll('a[href^="/"]').forEach(link => {
        link.addEventListener('click', e => {
            const href = link.getAttribute('href');
            // skip sidebar toggle brand and external
            if (!href || href === '#' || link.classList.contains('sidebar-brand')) return;
            if (e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            document.body.style.transition = 'opacity 0.18s ease';
            document.body.style.opacity   = '0';
            setTimeout(() => { window.location.href = href; }, 180);
        });
    });

})();
</script>
</body>
</html>
